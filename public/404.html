<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Redirecionando...</title>

    <script>
      (function (location) {
        const route = location.pathname
          .slice(1)
          .replace(/&/g, "~and~");

        location.replace(
          location.protocol +
            "//" +
            location.host +
            "/?/" +
            route +
            (location.search
              ? "&" + location.search.slice(1).replace(/&/g, "~and~")
              : "") +
            location.hash
        );
      })(window.location);
    </script>
  </head>

  <body></body>
</html>
